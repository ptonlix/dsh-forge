name: Desktop Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "要构建的 profile"
        required: false
        default: dsh-forge-official
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22.14.0"
  PNPM_VERSION: "11.7.0"
  PROFILE: ${{ inputs.profile || 'dsh-forge-official' }}
  DSH_FORGE_PROFILE_OFFLINE: "false"
  ELECTRON_REBUILD_DIST_URL: "https://www.electronjs.org/headers"

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run profile:resolve -- "${{ env.PROFILE }}"
      - run: pnpm run profile:verify -- "${{ env.PROFILE }}"
      - run: pnpm run dump-config -- "${{ env.PROFILE }}"
      - run: pnpm run catalog:verify
      - run: pnpm run docs:check
      - name: 校验 tag 版本
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          expected="$(pnpm exec tsx -e "import {parseDistribution} from './tools/profile-toolchain/src/core/schema.ts'; console.log(parseDistribution('distribution.yml').version)")"
          test "${GITHUB_REF_NAME#v}" = "$expected"

  package:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-universal
            runner: macos-14
            formats: dmg,zip
          - target: win32-x64
            runner: windows-2022
            formats: nsis,zip
          - target: linux-x64
            runner: ubuntu-22.04
            formats: AppImage,deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 缓存 Electron headers 与构建器下载
        uses: actions/cache@v4
        with:
          path: |
            ~/.electron-gyp
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ runner.arch }}-
            desktop-${{ runner.os }}-
      - name: 准备 Windows Builder 7za
        if: ${{ matrix.target == 'win32-x64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZipUrl = 'https://github.com/electron-userland/electron-builder-binaries/releases/download/7zip@1.0.0/7zip-win-x64.tar.gz'
          $sevenZipSha256 = 'be071f15bd6da2f78fe81c6ddef2009b0c4d8a51f36b780cb806c7e6df95e1b3'
          $toolParent = Join-Path $env:GITHUB_WORKSPACE '.ci-tools'
          $toolRoot = Join-Path $toolParent "dsh-forge-7zip-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $archive = Join-Path $toolRoot '7zip-win-x64.tar.gz'
          $sevenZip = Join-Path $toolRoot 'bin\7za.exe'
          New-Item -ItemType Directory -Path $toolParent -Force -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path $toolRoot -ErrorAction Stop | Out-Null
          Invoke-WebRequest -Uri $sevenZipUrl -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $sevenZipSha256) {
            throw "7za 下载摘要不匹配: expected=$sevenZipSha256 actual=$actualSha256"
          }
          $tar = Get-Command tar.exe -ErrorAction SilentlyContinue
          if ($null -eq $tar) {
            throw 'windows-2022 缺少 tar.exe，无法解包已校验的 Builder 7za'
          }
          & $tar.Source -xzf $archive -C $toolRoot --strip-components=1
          if ($LASTEXITCODE -ne 0) {
            throw "7za 解包失败: exit $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "解包后缺少 Builder 7za: $sevenZip"
          }
          $probe = @'
          const { spawnSync } = require('node:child_process');
          const executable = process.argv[1];
          const result = spawnSync(executable, ['i'], { encoding: 'utf8', windowsHide: true });
          process.stdout.write(JSON.stringify({
            stage: 'prepare',
            executable,
            cwd: process.cwd(),
            node: process.version,
            nodeArch: process.arch,
            systemRoot: process.env.SystemRoot || null,
            status: result.status,
            error: result.error ? { name: result.error.name, message: result.error.message, code: result.error.code || null } : null,
          }) + '\n');
          if (result.error) throw result.error;
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout || `7za exited with ${result.status}\n`);
            process.exit(result.status || 1);
          }
          '@
          node -e $probe -- $sevenZip
          "ELECTRON_BUILDER_7ZIP_PATH=$sevenZip" >> $env:GITHUB_ENV
      - name: 打印构建身份
        run: node -p "JSON.stringify({platform:process.platform,arch:process.arch,target:'${{ matrix.target }}',profile:process.env.PROFILE,node:process.version})"
      - run: pnpm install --frozen-lockfile
      - name: 安装后再次验证 Windows Builder 7za
        if: ${{ matrix.target == 'win32-x64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = $env:ELECTRON_BUILDER_7ZIP_PATH
          if ([string]::IsNullOrWhiteSpace($sevenZip)) {
            throw '安装后未找到 ELECTRON_BUILDER_7ZIP_PATH'
          }
          $item = Get-Item -LiteralPath $sevenZip -ErrorAction Stop
          $diagnostic = [ordered]@{
            stage = 'after-pnpm-install'
            executable = $sevenZip
            cwd = (Get-Location).Path
            exists = $true
            isFile = $item.PSIsContainer -eq $false
            size = $item.Length
            sha256 = (Get-FileHash -LiteralPath $sevenZip -Algorithm SHA256).Hash.ToLowerInvariant()
            node = node --version
            processArch = $env:PROCESSOR_ARCHITECTURE
            systemRoot = $env:SystemRoot
            workspace = $env:GITHUB_WORKSPACE
            runnerTemp = $env:RUNNER_TEMP
          }
          $diagnostic | ConvertTo-Json -Compress | Write-Output
          $probe = @'
          const { spawnSync } = require('node:child_process');
          const executable = process.argv[1];
          const result = spawnSync(executable, ['i'], {
            cwd: process.cwd(),
            encoding: 'utf8',
            env: process.env,
            windowsHide: true,
          });
          process.stdout.write(JSON.stringify({
            stage: 'after-pnpm-install-node-probe',
            executable,
            cwd: process.cwd(),
            node: process.version,
            nodeArch: process.arch,
            systemRoot: process.env.SystemRoot || null,
            status: result.status,
            error: result.error ? { name: result.error.name, message: result.error.message, code: result.error.code || null } : null,
          }) + '\n');
          if (result.error) throw result.error;
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout || `7za exited with ${result.status}\n`);
            process.exit(result.status || 1);
          }
          '@
          node -e $probe -- $sevenZip
      # package:desktop 会在同一进程中完成一次 workspace build、profile resolve
      # 和 config dump；这里不重复执行这些步骤。
      - run: pnpm run package:desktop -- "${{ env.PROFILE }}" --target "${{ matrix.target }}" --formats "${{ matrix.formats }}"
      - run: pnpm run package:inspect -- "${{ env.PROFILE }}"
      - name: Linux package smoke
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run --auto-servernum --server-args="-screen 0 1280x860x24 -nolisten tcp" \
            pnpm run package:smoke -- "${{ env.PROFILE }}" --target "${{ matrix.target }}"
      - name: Native package smoke
        if: ${{ matrix.target != 'linux-x64' }}
        run: pnpm run package:smoke -- "${{ env.PROFILE }}" --target "${{ matrix.target }}"
      - name: 汇总目标 artifact
        shell: bash
        run: |
          artifact_dir="$(find "artifacts/dsh-forge-official/${{ env.PROFILE }}" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$artifact_dir"
          mkdir -p "ci-artifact/${{ matrix.target }}/packages"
          cp -R "$artifact_dir"/* "ci-artifact/${{ matrix.target }}/"
          cp -R "$artifact_dir/desktop-dist" "ci-artifact/${{ matrix.target }}/packages/"
          printf '%s\n' "${{ matrix.target }}" > "ci-artifact/${{ matrix.target }}/target.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ci-artifact/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  summary:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false
      - run: pnpm install --frozen-lockfile
      - name: 校验矩阵结果并生成索引
        shell: bash
        run: |
          version="$(pnpm exec tsx -e "import {parseDistribution} from './tools/profile-toolchain/src/core/schema.ts'; console.log(parseDistribution('distribution.yml').version)")"
          pnpm run release:index -- \
            --root release-artifacts \
            --targets darwin-universal,win32-x64,linux-x64 \
            --distribution dsh-forge-official \
            --version "$version" \
            --profile "${{ env.PROFILE }}" \
            --run-id "$GITHUB_RUN_ID" \
            --output release-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-index
          path: release-index.json
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.summary.result == 'success' && needs.package.result == 'success' && vars.DSH_FORGE_PRODUCTION_RELEASE == 'true' }}
    needs: [package, summary]
    runs-on: ubuntu-22.04
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false
      - name: 重建 release gate 输入目录
        shell: bash
        run: |
          digest="$(node -e "const fs=require('fs'); const i=JSON.parse(fs.readFileSync('release-artifacts/release-index/release-index.json','utf8')); console.log(i.inputDigest)")"
          target_dir="artifacts/dsh-forge-official/${{ env.PROFILE }}/$digest"
          mkdir -p "$target_dir"
          cp "release-artifacts/darwin-universal/runtime-manifest.json" "$target_dir/"
          cp "release-artifacts/darwin-universal/package-evidence.json" "$target_dir/"
          cp "release-artifacts/darwin-universal/sbom.input.json" "$target_dir/"
          cp "release-artifacts/darwin-universal/THIRD-PARTY-NOTICES.txt" "$target_dir/"
          for target in darwin-universal win32-x64 linux-x64; do
            cp "release-artifacts/$target/native-verification.$target.json" "$target_dir/"
            cp "release-artifacts/$target/package-smoke.$target.json" "$target_dir/"
          done
      - run: pnpm install --frozen-lockfile
      - name: 执行 release gate
        run: pnpm run release:gate -- "${{ env.PROFILE }}"
      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          test "${#files[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" "${files[@]}" release-artifacts/release-index/release-index.json \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
